[package]
name = "pbd19_backend"
default-run = "pbd19_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "derive", "chrono", "tls-rustls-ring"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
argon2 = "0.5.3"
getrandom = "0.3"
sha2 = "0.10"
hex = "0.4"
rpassword = "7.5"